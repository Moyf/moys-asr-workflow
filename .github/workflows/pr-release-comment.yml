name: Comment on Windows PR Release

on:
  workflow_run:
    workflows: [Preview Windows Release]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Update PR build comment
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const marker = '<!-- maw-windows-pr-release -->';
            let pullRequest = run.pull_requests?.[0];

            if (!pullRequest && run.head_sha) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha,
              });
              pullRequest = associated.data.find((item) => item.state === 'open');
            }

            if (!pullRequest) {
              core.info('The completed run is not associated with an open pull request.');
              return;
            }

            const succeeded = run.conclusion === 'success';
            const shortSha = (run.head_sha || '').slice(0, 7);
            const updatedAt = new Date(run.updated_at || run.created_at || Date.now());
            const statusTitle = succeeded ? '🔧 Windows PR 打包完成' : '❌ Windows PR 打包失败';
            const statusText = succeeded
              ? 'Windows 无 FFmpeg 测试包已经生成。'
              : 'Windows 无 FFmpeg 测试包没有生成，请查看 Actions 日志。';
            const linkText = succeeded
              ? `[下载 Windows 无 FFmpeg 构建产物](${run.html_url})`
              : `[查看 GitHub Actions 日志](${run.html_url})`;

            const commentBody = `${marker}
            ## ${statusTitle}

            **构建信息：**
            - PR: #${pullRequest.number}
            - Commit: ${shortSha}
            - 构建时间（UTC）: ${updatedAt.toISOString()}
            - 触发原因：PR 提交或更新

            ${statusText}

            **下载链接：**
            ${linkText}

            成功后请进入上方 Actions 运行页面，在 **Artifacts** 区域下载 ZIP。该构建仅用于预览和测试。`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existingComment = comments.find((comment) => comment.body?.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body: commentBody,
              });
            }
