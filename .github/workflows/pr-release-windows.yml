name: Windows release preview (advisory)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.scope.outputs.preview }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci_impact.py

  build-windows:
    needs: selection
    if: ${{ needs.selection.outputs.preview == 'true' }}
    name: Advisory Windows x64 MAW-lite preview
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.4'
          enable-cache: true
      - name: Verify Launcher version
        run: python scripts/sync_launcher_version.py --check
      - name: Install locked dependencies
        run: uv sync --group build --frozen
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build web bundles
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm run build
      - name: Run packaging contract tests
        run: uv run --no-sync python scripts/run_check.py --timeout 180 -- uv run --no-sync python scripts/run_tests.py tests/test_packaging_contract.py
      - name: Download embedded Python bootstrap assets
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          curl.exe -L --retry 3 --connect-timeout 20 --max-time 300 -o build/python-3.11.9-embed-amd64.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Embedded Python download failed.' }
          curl.exe -L --retry 3 --connect-timeout 20 --max-time 120 -o build/get-pip.py https://bootstrap.pypa.io/get-pip.py
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap download failed.' }
      - name: Build MAW bundle
        shell: pwsh
        run: .\scripts\build-windows.ps1 -SkipTests
      - name: Verify bundled FAQ and runtime requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Required = @('FAQ-常见问题.txt', '_internal\local-runtime\requirements-local.txt', '_internal\ocr-runtime\requirements-ocr.txt', '_internal\moss-runtime\requirements-moss.txt')
          foreach ($Relative in $Required) {
            if (-not (Test-Path -LiteralPath (Join-Path 'dist\MAW' $Relative) -PathType Leaf)) {
              throw "Missing bundled input: $Relative"
            }
          }
      - name: Smoke MAW executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ExePath = 'dist\MAW\MAW.exe'
          if (-not (Test-Path -LiteralPath $ExePath -PathType Leaf)) { throw 'Missing executable.' }
          uv run --no-sync python scripts/run_check.py --timeout 120 -- uv run --no-sync python scripts/packaging/smoke_editor.py $ExePath
          if ($LASTEXITCODE -ne 0) { throw 'Packaged editor startup smoke failed.' }
      - name: Preserve packaged editor startup evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-packaged-editor-startup
          path: |
            .artifacts/packaged-editor-smoke/
            .artifacts/checks/
          include-hidden-files: true
          retention-days: 7
      - name: Verify no FFmpeg is bundled
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $BundledFfmpeg = Get-ChildItem -LiteralPath 'dist\MAW' -Recurse -File |
            Where-Object { $_.Name -in @('ffmpeg.exe', 'ffprobe.exe', 'ffplay.exe') }
          if ($BundledFfmpeg) { throw 'The preview must not bundle FFmpeg.' }
      - name: Create MAW-lite release preview archive
        shell: pwsh
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number || 'manual' }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Archive = "MAW-lite-Windows-x64-pr-$env:PREVIEW_PR-$env:PREVIEW_SHA.zip"
          Compress-Archive -LiteralPath 'dist\MAW' -DestinationPath $Archive -Force
      - name: Upload MAW-lite release preview
        uses: actions/upload-artifact@v6
        with:
          name: MAW-lite-Windows-x64-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: MAW-lite-Windows-x64-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
