name: Change checks

on:
  pull_request:
  push:
    branches: [main, 2.0dev]

permissions:
  contents: read

concurrency:
  group: change-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/ci_impact.py --plan .artifacts/blocking/plan.json
      - uses: actions/upload-artifact@v6
        with:
          name: blocking-plan
          path: .artifacts/blocking/plan.json
          include-hidden-files: true
          if-no-files-found: error

  checks:
    needs: selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          name: blocking-plan
          path: .artifacts/blocking
      - uses: pnpm/action-setup@v6
        if: ${{ matrix.check == 'build' || matrix.check == 'editor' || matrix.check == 'website' }}
        with:
          version: 11.28.4
          run_install: false
      - name: Install build and editor dependencies without postinstall
        if: ${{ matrix.check == 'build' || matrix.check == 'editor' }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install only the direct-save contract dependency
        if: ${{ matrix.check == 'data' || matrix.check == 'runtime' || matrix.check == 'ci' }}
        run: python -m pip install --no-deps --require-hashes -r scripts/ci-contract-requirements.txt
      - name: Install website dependencies
        if: ${{ matrix.check == 'website' }}
        run: pnpm --dir website install --frozen-lockfile
      - name: Run admitted check and validate evidence
        env:
          MAW_TEST_PYTHON: python
        run: python scripts/ci_acceptance.py run --check ${{ matrix.check }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blocking-receipt-${{ matrix.check }}
          path: .artifacts/blocking/evidence/
          include-hidden-files: true
          if-no-files-found: error
  acceptance:
    name: Change acceptance
    if: always()
    needs: [selection, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v6
        with:
          name: blocking-plan
          path: .artifacts/blocking
      - uses: actions/download-artifact@v6
        with:
          pattern: blocking-receipt-*
          path: .artifacts/blocking/evidence
          merge-multiple: true
      - name: Prepare only the transported-report import dependency
        if: ${{ needs.selection.result == 'success' && (contains(fromJSON(needs.selection.outputs.plan).checks, 'data') || contains(fromJSON(needs.selection.outputs.plan).checks, 'runtime') || contains(fromJSON(needs.selection.outputs.plan).checks, 'ci')) }}
        run: python -m pip install --no-deps --require-hashes -r scripts/ci-contract-requirements.txt
      - name: Require selected successful receipts for this SHA
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci_acceptance.py gate
