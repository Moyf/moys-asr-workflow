name: Change checks

on:
  pull_request:
  push:
    branches: [main, 2.0dev]

permissions:
  contents: read

concurrency:
  group: change-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      matrix: ${{ steps.scope.outputs.matrix }}
      has_checks: ${{ steps.scope.outputs.has_checks }}
      aux_selected: ${{ steps.scope.outputs.aux_selected }}
      aux_error: ${{ steps.scope.outputs.aux_error }}
      aux_python: ${{ steps.scope.outputs.aux_python }}
      aux_node: ${{ steps.scope.outputs.aux_node }}
      aux_browser: ${{ steps.scope.outputs.aux_browser }}
      aux_application: ${{ steps.scope.outputs.aux_application }}
      aux_editor_bundle: ${{ steps.scope.outputs.aux_editor_bundle }}
      aux_launcher_bundle: ${{ steps.scope.outputs.aux_launcher_bundle }}
      aux_media: ${{ steps.scope.outputs.aux_real_media }}
      aux_python_dependencies: ${{ steps.scope.outputs.aux_python_dependencies }}
      aux_node_browser: ${{ steps.scope.outputs.aux_node_browser }}
      aux_website: ${{ steps.scope.outputs.aux_website }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/ci_impact.py --plan .artifacts/blocking/plan.json --aux-plan .artifacts/auxiliary/plan.json
      - uses: actions/upload-artifact@v6
        with:
          name: blocking-plan
          path: .artifacts/blocking/plan.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: ${{ steps.scope.outputs.aux_selected == 'true' }}
        with:
          name: auxiliary-plan
          path: .artifacts/auxiliary/plan.json
          include-hidden-files: true
          if-no-files-found: error

  auxiliary:
    name: Targeted auxiliary tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: selection
    if: ${{ needs.selection.outputs.aux_selected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.selection.outputs.aux_browser == 'true' && '[1,2]' || '[1]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v6
        id: plan
        with:
          name: auxiliary-plan
          path: .artifacts/auxiliary/
      - name: Require a valid auxiliary plan
        if: ${{ needs.selection.outputs.aux_error == 'true' }}
        run: python -c "import json,pathlib; raise SystemExit(json.loads(pathlib.Path('.artifacts/auxiliary/plan.json').read_text(encoding='utf8'))['generation_error'])"
      - uses: pnpm/action-setup@v6
        id: pnpm
        if: ${{ steps.plan.outcome == 'success' && (needs.selection.outputs.aux_node == 'true' || needs.selection.outputs.aux_browser == 'true' || needs.selection.outputs.aux_application == 'true') }}
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        id: node
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && (needs.selection.outputs.aux_node == 'true' || needs.selection.outputs.aux_browser == 'true' || needs.selection.outputs.aux_application == 'true') }}
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Install JavaScript test dependencies
        id: js_install
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' && steps.node.outcome == 'success' }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build required Editor bundle
        id: build_editor
        if: ${{ !cancelled() && steps.js_install.outcome == 'success' && needs.selection.outputs.aux_editor_bundle == 'true' }}
        run: python scripts/run_check.py --timeout 180 -- pnpm run build:editor
      - name: Build required Launcher bundle
        id: build_launcher
        if: ${{ !cancelled() && steps.js_install.outcome == 'success' && needs.selection.outputs.aux_launcher_bundle == 'true' }}
        run: python scripts/run_check.py --timeout 180 -- pnpm run build:launcher
      - uses: astral-sh/setup-uv@v7
        id: uv
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && needs.selection.outputs.aux_python_dependencies == 'true' }}
        with:
          version: '0.13.4'
          enable-cache: true
      - name: Install required Python dependencies
        id: py_install
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        run: uv sync --frozen --group test --group dev
      - name: Install Chromium only for its consumers
        id: chromium
        if: ${{ !cancelled() && steps.js_install.outcome == 'success' && (needs.selection.outputs.aux_browser == 'true' || needs.selection.outputs.aux_node_browser == 'true') }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Install required media tools
        id: ffmpeg
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && needs.selection.outputs.aux_media == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install website dependencies
        id: website_install
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' && steps.node.outcome == 'success' && needs.selection.outputs.aux_website == 'true' }}
        run: pnpm --dir website install --frozen-lockfile
      - name: Synchronize website docs
        id: website_docs
        if: ${{ !cancelled() && steps.node.outcome == 'success' && needs.selection.outputs.aux_website == 'true' }}
        run: python scripts/run_check.py --timeout 180 -- node website/scripts/sync-maw-docs.mjs
      - name: Generate website release data
        id: website_releases
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && needs.selection.outputs.aux_website == 'true' }}
        run: python scripts/run_check.py --timeout 180 -- python scripts/build_release_site.py --preview
      - name: Build website for its browser consumer
        id: website_build
        if: ${{ !cancelled() && steps.website_install.outcome == 'success' && steps.website_docs.outcome == 'success' && steps.website_releases.outcome == 'success' }}
        run: python scripts/run_check.py --timeout 300 -- pnpm --dir website run build
      - name: Selected additional Python tests
        if: ${{ !cancelled() && matrix.shard == 1 && steps.plan.outcome == 'success' && needs.selection.outputs.aux_python == 'true' }}
        env:
          CI_PREPARATION: ${{ toJSON(steps) }}
        run: python scripts/ci_run_layer.py --layer python --report-dir .artifacts/auxiliary-python
      - name: Selected additional Node tests
        if: ${{ !cancelled() && matrix.shard == 1 && steps.plan.outcome == 'success' && needs.selection.outputs.aux_node == 'true' }}
        env:
          CI_PREPARATION: ${{ toJSON(steps) }}
        run: python scripts/ci_run_layer.py --layer node --report-dir .artifacts/auxiliary-node
      - name: Selected additional browser tests
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && needs.selection.outputs.aux_browser == 'true' }}
        env:
          CI_PREPARATION: ${{ toJSON(steps) }}
        run: python scripts/ci_run_layer.py --layer browser --shard ${{ matrix.shard }}/${{ strategy.job-total }} --report-dir .artifacts/auxiliary-browser
      - name: Preserve auxiliary results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: targeted-auxiliary-results-${{ matrix.shard }}
          path: |
            .artifacts/auxiliary*/
            .artifacts/checks/
            test-results/
          include-hidden-files: true
          retention-days: 7

  checks:
    needs: selection
    if: ${{ needs.selection.outputs.has_checks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Manifest changes are compared with the trusted base again when
          # the admission plan is verified in this fresh job.
          fetch-depth: ${{ contains(fromJSON(needs.selection.outputs.plan).paths, 'package.json') && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v6
        id: plan
        with:
          name: blocking-plan
          path: .artifacts/blocking
      - uses: actions/setup-node@v5
        id: node
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        if: ${{ matrix.check == 'build' || matrix.check == 'editor' || matrix.check == 'website' }}
        with:
          version: 11.28.4
          run_install: false
      - name: Install build and editor dependencies without postinstall
        id: js_install
        if: ${{ matrix.check == 'build' || matrix.check == 'editor' }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install only the direct-save contract dependency
        id: py_install
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && (matrix.check == 'data' || matrix.check == 'runtime' || matrix.check == 'ci') }}
        run: python -m pip install --no-deps --require-hashes -r scripts/ci-contract-requirements.txt
      - name: Install website dependencies
        id: website_install
        if: ${{ matrix.check == 'website' }}
        run: pnpm --dir website install --frozen-lockfile
      - name: Run admitted check and validate evidence
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        env:
          CI_PREPARATION: ${{ toJSON(steps) }}
          MAW_TEST_PYTHON: python
        run: python scripts/ci_acceptance.py run --check ${{ matrix.check }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blocking-receipt-${{ matrix.check }}
          path: .artifacts/blocking/evidence/
          include-hidden-files: true
          if-no-files-found: error
  acceptance:
    name: Change acceptance
    if: always()
    needs: [selection, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ needs.selection.result == 'success' && contains(fromJSON(needs.selection.outputs.plan).paths, 'package.json') && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v6
        id: plan
        with:
          name: blocking-plan
          path: .artifacts/blocking
      - uses: actions/download-artifact@v6
        if: ${{ needs.selection.outputs.has_checks == 'true' }}
        with:
          pattern: blocking-receipt-*
          path: .artifacts/blocking/evidence
          merge-multiple: true
      - name: Prepare only the transported-report import dependency
        if: ${{ needs.selection.result == 'success' && (contains(fromJSON(needs.selection.outputs.plan).checks, 'data') || contains(fromJSON(needs.selection.outputs.plan).checks, 'runtime') || contains(fromJSON(needs.selection.outputs.plan).checks, 'ci')) }}
        run: python -m pip install --no-deps --require-hashes -r scripts/ci-contract-requirements.txt
      - name: Require selected successful receipts for this SHA
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci_acceptance.py gate
      - name: Collect admitted failure records
        id: failure_summary
        if: ${{ failure() && steps.plan.outcome == 'success' }}
        run: |
          if [ ! -f .artifacts/blocking/failures.json ]; then
            python scripts/ci_acceptance.py summarize
          fi
      - name: Preserve admitted failure summary
        if: ${{ failure() && steps.failure_summary.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: blocking-failures
          path: .artifacts/blocking/failures.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
