name: Editor build and contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: editor-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug-tools:
    name: Debug tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # These checks need only the standard libraries: no uv/pnpm install.
      # Separate native commands so a later success cannot mask an earlier
      # documentation failure under the Windows PowerShell shell.
      - name: Documentation navigation and consumers
        run: python scripts/run_check.py --timeout 180 -- python scripts/check_docs.py
      - name: Documentation regressions
        run: python scripts/run_check.py --timeout 180 -- python scripts/run_tests.py tests/test_docs_check.py
      - name: Release documents
        run: python scripts/run_check.py --timeout 60 -- python scripts/prepare_release_notes.py --check-all
      - name: Release pipeline contracts
        run: python scripts/run_check.py --timeout 90 -- python scripts/run_tests.py tests/test_release_notes.py tests/test_release_site.py tests/test_release_publication.py
      - name: Runner output, exit codes and timeout cleanup
        run: python scripts/run_check.py --timeout 60 -- python -m unittest tests.test_run_check tests.test_compact_assertions
      - name: Server diagnostics and process lifecycle
        run: python scripts/run_check.py --timeout 60 -- node --test tests/test_e2e_output_tail.mjs tests/test_e2e_server_lifecycle.mjs
      - name: Preserve failed check evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: debug-tools-${{ matrix.os }}
          path: .artifacts/checks/
          include-hidden-files: true
          retention-days: 7
  editor:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Bundles are build artifacts (not committed): build once for every later
      # step that reads them (assembly contracts, test:unit, e2e). pnpm install
      # already builds via postinstall; keep this explicit so it does not rely
      # on the hook.
      - run: pnpm run build
      - run: pnpm run typecheck
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --frozen
      # Node tests also launch Chromium and compare against Python exporters.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:unit
        env:
          MAW_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - name: Python assembly contracts
        run: |
          uv run --no-sync python scripts/run_tests.py tests/test_editor_assets.py
          uv run --no-sync python scripts/run_tests.py tests/test_editor_manifest.py
      - name: Install FFmpeg for synthetic editor fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Required media failure compatibility
        run: uv run --no-sync python scripts/run_check.py --timeout 180 -- uv run --no-sync python scripts/run_tests.py tests/test_media.py tests/test_ffmpeg.py tests/test_ffprobe_failure_integration.py --required --report .artifacts/media-required.json
      - name: Preserve media required report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: media-required-${{ runner.os }}
          path: |
            .artifacts/media-required.json
            .artifacts/media-required.log
            .artifacts/checks/
          include-hidden-files: true
          retention-days: 7

      - name: Real file and HTTP editor
        env:
          MAW_E2E_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: pnpm exec playwright test --config=tests/config/playwright.config.mjs --project=chromium tests/e2e/editor-bundle.spec.mjs tests/e2e/editor-transactions.spec.mjs tests/e2e/editor-text-tools.spec.mjs tests/e2e/ass-cue-position.spec.mjs tests/e2e/sticker-preview-lifecycle.spec.mjs
