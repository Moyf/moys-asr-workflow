name: Editor build and contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: editor-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Check the committed artifact before anything can regenerate it.
      - run: npm run check:editor
      - run: npm run typecheck
      - run: npm run test:unit
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Python assembly contracts
        run: |
          uv run --no-sync python -m unittest discover -s tests -p test_editor_assets.py
          uv run --no-sync python -m unittest discover -s tests -p test_editor_manifest.py
      - run: npx playwright install --with-deps chromium
      - name: Real file and HTTP editor
        env:
          MAW_E2E_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npx playwright test --project=chromium tests/e2e/editor-bundle.spec.mjs tests/e2e/editor-transactions.spec.mjs
