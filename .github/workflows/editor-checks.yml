name: Change checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: editor-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Select trusted blocking scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/ci_impact.py --plan .artifacts/blocking/plan.json
      - name: Validate blocking plan
        run: python scripts/ci_acceptance.py validate
      - uses: actions/upload-artifact@v6
        with:
          name: blocking-v2-plan
          path: .artifacts/blocking/*.json
          include-hidden-files: true
          if-no-files-found: error

  checks:
    needs: selection
    if: needs.selection.result == 'success'
    name: Blocking / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: blocking-v2-plan
          path: .artifacts/blocking/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Install audited JS dependencies only when required
        if: matrix.check == 'build' || matrix.check == 'editor'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install website dependencies only for its consumers
        if: matrix.check == 'website'
        run: pnpm --dir website install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.4'
      - name: Install application dependencies for audited Python contracts
        if: matrix.check == 'data' || matrix.check == 'runtime'
        run: uv sync --frozen --group test
      - name: Install CI contract discovery dependencies (Pillow import, no rendering)
        if: matrix.check == 'ci'
        run: uv sync --frozen --group test --group dev
      - name: Run admitted check (no full discovery, browser or native media)
        if: matrix.check != 'data' && matrix.check != 'runtime' && matrix.check != 'ci'
        run: python scripts/ci_acceptance.py run --check ${{ matrix.check }}
      - name: Run admitted Python contracts
        if: matrix.check == 'data' || matrix.check == 'runtime' || matrix.check == 'ci'
        run: uv run --no-sync python scripts/ci_acceptance.py run --check ${{ matrix.check }}
      - name: Preserve exact blocking evidence, including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blocking-v2-${{ matrix.check }}
          path: |
            .artifacts/blocking/evidence/
            .artifacts/checks/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  acceptance:
    name: Change acceptance
    if: always()
    needs: [selection, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          name: blocking-v2-plan
          path: .artifacts/blocking/
      - uses: actions/download-artifact@v7
        with:
          pattern: blocking-v2-*
          path: .artifacts/blocking/evidence/
      - name: Validate selected jobs and exact receipts
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci_acceptance.py gate
