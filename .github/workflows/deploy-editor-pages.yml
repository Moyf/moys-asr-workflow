name: Deploy MAW website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "README.md"
      - "JSON_SCHEMA.md"
      - "docs/**"
      - "edit.py"
      - "web/**"
      - "waveform.py"
      - "reapeaks_io.py"
      - "maw/**"
      - ".github/workflows/deploy-editor-pages.yml"
  workflow_dispatch:

concurrency:
  group: editor-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Sync MAW documentation
        working-directory: website
        run: npm run sync:docs

      - name: Build website
        working-directory: website
        env:
          SITE_URL: https://moyf.github.io/moys-asr-workflow
          BASE_PATH: /moys-asr-workflow
        run: npm run build

      - name: Add portable editor page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/dist/editor
          python edit.py --blank -o website/dist/editor/index.html
          touch website/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
