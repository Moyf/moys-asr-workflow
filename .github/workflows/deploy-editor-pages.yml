name: Deploy MAW website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "edit.py"
      - "web/**"
      - "scripts/build-*.mjs"
      - "scripts/build_release_site.py"
      - "scripts/prepare_release_notes.py"
      - "scripts/verify_release_site.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "maw/quapeaks.py"
      - "maw/**"
      - ".github/workflows/deploy-editor-pages.yml"
  workflow_dispatch:
    inputs:
      expected_tag:
        description: Published stable tag to verify (optional)
        required: false
        type: string
  workflow_call:
    inputs:
      expected_tag:
        required: false
        default: ''
        type: string

concurrency:
  group: editor-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://moyf.github.io
      BASE_PATH: /moys-asr-workflow

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"

      - name: Install locked Python dependencies
        run: uv sync --frozen --no-group build --no-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Build web bundles
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Sync MAW documentation
        working-directory: website
        run: pnpm run sync:docs

      - name: Verify archives and build published releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ inputs.expected_tag || '' }}
        run: |
          python scripts/run_check.py --timeout 60 -- python scripts/prepare_release_notes.py --check-all
          python scripts/run_check.py --timeout 180 -- python scripts/build_release_site.py --github --expected-tag "$EXPECTED_TAG"

      - name: Build website
        working-directory: website
        run: python ../scripts/run_check.py --timeout 180 -- pnpm run build

      - name: Add portable editor page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/dist/editor
          # Deployment-only artifact build; local development does not refresh
          # the repository-root blank-editor.html by default.
          uv run --no-sync python edit.py --blank -o website/dist/editor/index.html
          touch website/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed release index and detail
        id: verify_site
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag || '' }}
        run: python scripts/run_check.py --timeout 360 -- python scripts/verify_release_site.py --base-url "${SITE_URL}${BASE_PATH}" --expected-tag "$EXPECTED_TAG" --timeout 300 --retry-interval 10

      - name: Report website synchronization failure and recovery
        if: failure() && steps.verify_site.outcome == 'failure'
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag || '' }}
          # Reusable workflows inherit the caller's workflow name and ref.
          # release.yml calls this only after its publish job succeeds; merely
          # supplying expected_tag in a manual Pages run is not publication proof.
          RELEASE_CALL: ${{ github.workflow == 'Release MAW GUI' && startsWith(github.ref, 'refs/tags/v') && inputs.expected_tag == github.ref_name }}
        shell: bash
        run: |
          {
            echo '### Website pending synchronization / 官网待同步'
            if [[ "$RELEASE_CALL" == 'true' ]]; then
              echo 'Installation packages are published; website verification failed. / 安装包已发布，官网待同步。'
            else
              echo 'Website verification failed. This Pages run does not establish whether installation packages are published.'
            fi
            echo 'The public index, notes or detail page did not verify within the bounded wait; inspect the verification artifact for the last error.'
            echo 'Retry only the Pages workflow from Actions → Deploy MAW website to GitHub Pages → Run workflow (main), entering the published stable expected_tag.'
            echo 'CLI alternative (replace vVERSION with the published stable tag):'
            echo '```sh'
            printf 'gh workflow run deploy-editor-pages.yml --ref main -f expected_tag=%q\n' "${EXPECTED_TAG:-vVERSION}"
            echo '```'
            echo 'Recheck the public URLs after the retry. Do not rerun package publication, withdraw the Release or move its tag. The failed run remains failed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve deployed verification diagnostics
        if: always() && (steps.verify_site.outcome == 'success' || steps.verify_site.outcome == 'failure')
        uses: actions/upload-artifact@v6
        with:
          name: release-site-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/checks/**/output.log
            .artifacts/checks/**/result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
