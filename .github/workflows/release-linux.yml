name: Release Linux GUI (AppImage)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # ffmpeg：生成 AppImage 图标；squashfs-tools：appimagetool 需要
          # libnss3 等：PyInstaller 收集 QtWebEngine 的运行时依赖
          sudo apt-get install -y \
            ffmpeg squashfs-tools \
            libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbcommon0 libxkbcommon-x11-0 libpci3 libgl1 libegl1 \
            libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 \
            xvfb
          sudo apt-get clean

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          Version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ "${{ github.ref_name }}" != "v${Version}" ]; then
            echo "Tag ${{ github.ref_name }} does not match pyproject version v${Version}."
            exit 1
          fi

      - name: Sync Launcher version from project metadata
        run: python scripts/sync_launcher_version.py --write

      - name: Verify Launcher version
        run: python scripts/sync_launcher_version.py --check

      - name: Install locked dependencies
        run: uv sync --group build --frozen

      - name: Run packaging contract tests
        run: uv run python -m unittest tests/test_packaging_contract.py

      - name: Run Python tests
        run: uv run python -m unittest discover -s tests -p "test_*.py"

      - name: Build AppImage
        run: bash scripts/build-appimage.sh

      - name: Verify AppImage output
        run: |
          set -euo pipefail
          AppImage="build-appimage/MAW-x86_64.AppImage"
          test -f "$AppImage"
          test -x "$AppImage"
          file "$AppImage" | grep -q 'ELF 64-bit'

      - name: Diagnose AppImage libraries
        if: always()
        run: |
          cd build-appimage
          ./MAW-x86_64.AppImage --appimage-extract >/dev/null 2>&1 || true
          echo "=== Qt6/lib 里 xcb-cursor 相关:"
          ls squashfs-root/_internal/PyQt6/Qt6/lib/ 2>/dev/null | grep -i xcb || echo "(无)"
          echo "=== libqxcb.so 缺失依赖:"
          ldd squashfs-root/_internal/PyQt6/Qt6/plugins/platforms/libqxcb.so 2>&1 | grep "not found" || echo "(依赖完整)"
          rm -r squashfs-root

      - name: Smoke AppImage (headless)
        run: |
          set -euo pipefail
          AppImage="build-appimage/MAW-x86_64.AppImage"
          # 无 FUSE 环境用解压运行模式；timeout 命中（124）说明 GUI 事件循环在正常存活
          set +e
          timeout 60 xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$AppImage" > /tmp/maw-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "AppImage did not stay running (status $status). See log:"
            tail -50 /tmp/maw-smoke.log
            exit 1
          fi

      - name: Rename AppImage with version
        run: |
          set -euo pipefail
          mv "build-appimage/MAW-x86_64.AppImage" "build-appimage/MAW-x86_64-${{ github.ref_name }}.AppImage"
          test -f "build-appimage/MAW-x86_64-${{ github.ref_name }}.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAW-x86_64-${{ github.ref_name }}
          path: build-appimage/MAW-x86_64-${{ github.ref_name }}.AppImage
          if-no-files-found: error

      - name: Prepare release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          Version="${{ github.ref_name }}"
          Version="${Version#v}"
          python3 - "$Version" <<'PYEOF'
          import re
          import sys

          version = sys.argv[1]
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = re.compile(
              r"(?ms)^## \[%s\][^\r\n]*\r?\n.*?(?=^## \[|\Z)" % re.escape(version)
          )
          match = pattern.search(changelog)
          if not match:
              raise SystemExit(f"CHANGELOG.md does not contain a release section for {version}.")

          guide = """## 下载哪个？

          - **Linux x86_64** ： 下载 ``MAW-x86_64-${{ github.ref_name }}.AppImage`` ，赋予执行权限后直接运行（``chmod +x``）。

          AppImage 依赖系统安装的 ``ffmpeg`` / ``ffprobe`` （需在 PATH 中）。首次启动会在用户目录缓存 Noto Color Emoji 字体，之后离线可用；Launcher 配置保存在用户目录（``~/.config/Moy/MAW/.env`` ，目录不可写时回退 ``~/.cache`` ）。若系统缺少 ``libappimage`` ，Dolphin 等文件管理器不会为 AppImage 文件生成图标，可安装 ``libappimage`` 或使用仓库内的 ``scripts/make-appimage-thumbnail.py`` 生成缩略图缓存。
          """
          body = guide.strip() + "\n\n" + match.group(0).strip() + "\n"
          open("release-notes.md", "w", encoding="utf-8").write(body)
          PYEOF

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          Tag="${{ github.ref_name }}"
          case "$Tag" in *-*) Prerelease=true;; *) Prerelease=false;; esac
          # 并发安全：已存在则跳过创建；create 撞 already_exists 时继续上传
          if ! gh release view "$Tag" >/dev/null 2>&1; then
            gh release create "$Tag" \
              --title "$Tag" \
              --notes-file release-notes.md \
              --prerelease="$Prerelease" \
              --target "${{ github.sha }}" || true
          fi
          gh release upload "$Tag" "build-appimage/MAW-x86_64-$Tag.AppImage" --clobber
