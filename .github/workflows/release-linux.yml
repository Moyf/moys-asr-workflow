name: Release Linux GUI (AppImage)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # ffmpeg：生成 AppImage 图标；squashfs-tools：appimagetool 需要
          # libnss3 等：PyInstaller 收集 QtWebEngine 的运行时依赖
          sudo apt-get install -y \
            ffmpeg squashfs-tools \
            libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbcommon0 libxkbcommon-x11-0 libpci3 libgl1 libegl1 \
            libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 \
            xvfb
          sudo apt-get clean

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          Version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ "${{ github.ref_name }}" != "v${Version}" ]; then
            echo "Tag ${{ github.ref_name }} does not match pyproject version v${Version}."
            exit 1
          fi

      - name: Sync Launcher version from project metadata
        run: python scripts/sync_launcher_version.py --write

      - name: Verify Launcher version
        run: python scripts/sync_launcher_version.py --check

      - name: Install locked dependencies
        run: uv sync --group build --frozen

      - name: Run packaging contract tests
        run: uv run python -m unittest tests/test_packaging_contract.py

      - name: Run Python tests
        run: uv run python -m unittest discover -s tests -p "test_*.py"

      - name: Build AppImage
        run: bash scripts/build-appimage.sh

      - name: Verify AppImage output
        run: |
          set -euo pipefail
          AppImage="build-appimage/MAW-x86_64.AppImage"
          test -f "$AppImage"
          test -x "$AppImage"
          file "$AppImage" | grep -q 'ELF 64-bit'

      - name: Verify no bundled C++ runtime in AppImage
        run: |
          set -euo pipefail
          cd build-appimage
          ./MAW-x86_64.AppImage --appimage-extract >/dev/null 2>&1
          if [ -e squashfs-root/_internal/libstdc++.so.6 ] || [ -e squashfs-root/_internal/libgcc_s.so.1 ] || [ -e squashfs-root/_internal/libgbm.so.1 ]; then
            echo "FAIL: AppImage 内置了 libstdc++/libgcc_s/libgbm，会污染系统 Mesa 驱动加载"
            exit 1
          fi
          echo "OK: 未内置 libstdc++/libgcc_s/libgbm"
          rm -r squashfs-root

      - name: Diagnose AppImage libraries
        if: always()
        run: |
          cd build-appimage
          ./MAW-x86_64.AppImage --appimage-extract >/dev/null 2>&1 || true
          echo "=== Qt6/lib 里 xcb-cursor 相关:"
          ls squashfs-root/_internal/PyQt6/Qt6/lib/ 2>/dev/null | grep -i xcb || echo "(无)"
          echo "=== libqxcb.so 缺失依赖:"
          ldd squashfs-root/_internal/PyQt6/Qt6/plugins/platforms/libqxcb.so 2>&1 | grep "not found" || echo "(依赖完整)"
          rm -r squashfs-root

      - name: Verify bundled static ffmpeg under polluted environment
        run: |
          set -euo pipefail
          cd build-appimage
          ./MAW-x86_64.AppImage --appimage-extract >/dev/null 2>&1
          BIN="squashfs-root/ffmpeg/bin"
          test -x "$BIN/ffmpeg"
          test -x "$BIN/ffprobe"
          # 模拟 PyInstaller bootloader：LD_LIBRARY_PATH 指向 _internal（含旧 libstdc++）。
          # 静态 ffmpeg 必须自包含，在此污染环境下仍能正常运行；动态版会
          # 在这里报 GLIBCXX_3.4.32 not found。
          export LD_LIBRARY_PATH="$PWD/squashfs-root/_internal"
          "$BIN/ffmpeg" -version >/dev/null
          "$BIN/ffprobe" -version >/dev/null
          echo "OK: 静态 ffmpeg 在污染 LD_LIBRARY_PATH 下正常运行"
          rm -r squashfs-root

      - name: Smoke AppImage (headless)
        run: |
          set -euo pipefail
          AppImage="build-appimage/MAW-x86_64.AppImage"
          # 无 FUSE 环境用解压运行模式；timeout 命中（124）说明 GUI 事件循环在正常存活
          set +e
          timeout 60 xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$AppImage" > /tmp/maw-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "AppImage did not stay running (status $status). See log:"
            tail -50 /tmp/maw-smoke.log
            exit 1
          fi

      - name: Rename AppImage with version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mv "build-appimage/MAW-x86_64.AppImage" "build-appimage/MAW-x86_64-${{ github.ref_name }}.AppImage"
          test -f "build-appimage/MAW-x86_64-${{ github.ref_name }}.AppImage"

      - name: Compute artifact name
        id: artifact-name
        shell: bash
        run: |
          RefName="${GITHUB_REF_NAME:-dev}"
          # upload-artifact 禁止 / \ * ? " < > | : 等字符；dispatch 触发时
          # ref_name 是分支名（含 /），统一清洗成合法 artifact 名。
          CleanName="${RefName//[^a-zA-Z0-9._-]/-}"
          echo "name=MAW-x86_64-${CleanName}" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: build-appimage/MAW-x86_64*.AppImage
          if-no-files-found: error

      - name: Prepare release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/prepare_release_notes.py --tag "${{ github.ref_name }}" --output release-notes.md

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          Tag="${{ github.ref_name }}"
          case "$Tag" in *-*) Prerelease=true;; *) Prerelease=false;; esac
          # 并发安全：已存在则跳过创建；create 撞 already_exists 时继续上传
          if ! gh release view "$Tag" >/dev/null 2>&1; then
            gh release create "$Tag" \
              --title "$Tag" \
              --notes-file release-notes.md \
              --prerelease="$Prerelease" \
              --target "${{ github.sha }}" || true
          fi
          gh release edit "$Tag" --title "$Tag" --notes-file release-notes.md
          gh release upload "$Tag" "build-appimage/MAW-x86_64-$Tag.AppImage" --clobber
