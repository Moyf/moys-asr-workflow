<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light">
<title>AI 处理前后对比</title>
<script>
// 首屏防闪烁：样式生效前按本页记忆的主题 / 系统偏好设置 data-theme（无记忆时跟随系统）。
(function(){var pref='system';try{pref=localStorage.getItem('maw.ai-comparison.theme')||'system';}catch(e){}var dark=pref==='dark'||(pref!=='light'&&!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches));if(!dark)document.documentElement.dataset.theme='light';})();
</script>
<style>
/* 设计令牌与 Launcher / MAWE 对齐：暗色 = 炭灰底 + 橙强调；亮色 = 白底 + 红强调。不使用渐变。 */
:root{
 color-scheme:dark;
 --bg-base:#1c1c20;--bg-panel:#26262b;--bg-raised:#2e2e34;--bg-input:#232328;--segment-track:#232328;
 --text-primary:#f3f1ee;--text-secondary:#d4d0cb;--text-muted:#b0aba5;--text-faint:#7c7873;
 --border-subtle:#36363d;--border:#44444c;--border-strong:#55555e;
 --accent:#f09a50;--accent-hover:#f5ad6c;--accent-text:#1c0f05;--accent-tint:rgba(240,154,80,.12);--accent-soft:rgba(240,154,80,.24);
 --info:#6ca5e8;--info-soft:rgba(108,165,232,.16);
 --amber:#f2bd5c;--amber-soft:rgba(242,189,92,.14);--amber-line:rgba(242,189,92,.5);
 --red:#f07c74;--red-soft:rgba(240,124,116,.16);
 --del-text:#f49690;--del-bg:rgba(240,124,116,.16);--ins-text:#86dcae;--ins-bg:rgba(87,201,147,.16);
 --btn-bg:#2e2e34;--btn-bg-hover:#38383f;--btn-text:#e6e2dd;
 --shadow-1:0 1px 2px rgba(0,0,0,.25);--shadow-sticky:0 6px 16px rgba(0,0,0,.28);
 --radius-sm:6px;--radius-md:9px;--radius-lg:14px;
 --focus-ring:0 0 0 3px var(--accent-soft);
 --t-fast:130ms ease-out;
 --font-sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif;
 --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="light"]{
 color-scheme:light;
 --bg-base:#f4f4f5;--bg-panel:#ffffff;--bg-raised:#f1f1f3;--bg-input:#ffffff;--segment-track:#e9e9ec;
 --text-primary:#1d1d20;--text-secondary:#46464d;--text-muted:#64646c;--text-faint:#a1a1a8;
 --border-subtle:#e6e6e9;--border:#d2d2d7;--border-strong:#b9b9c0;
 --accent:#c84545;--accent-hover:#b03a3a;--accent-text:#ffffff;--accent-tint:rgba(200,69,69,.08);--accent-soft:rgba(200,69,69,.18);
 --info:#3874c9;--info-soft:rgba(56,116,201,.12);
 --amber:#8a5a0e;--amber-soft:rgba(217,154,30,.14);--amber-line:rgba(180,125,20,.55);
 --red:#c84545;--red-soft:rgba(200,69,69,.1);
 --del-text:#b03a3a;--del-bg:rgba(200,69,69,.1);--ins-text:#17734a;--ins-bg:rgba(29,138,87,.13);
 --btn-bg:#ffffff;--btn-bg-hover:#f1f1f3;--btn-text:#2c2c31;
 --shadow-1:0 1px 2px rgba(20,20,30,.05);--shadow-sticky:0 6px 16px rgba(20,20,30,.06);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg-base);overflow-x:clip}
body{margin:0;overflow-x:clip;background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{max-width:1180px;margin:0 auto;padding:40px 28px 72px}

/* 页头：标题 + 主题切换 + 说明 + 统计 */
.page-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:start}
.eyebrow{margin:0;color:var(--accent);font-size:14px;font-weight:600;letter-spacing:.04em}
h1{margin:4px 0 0;font-size:30px;line-height:1.3;font-weight:700;overflow-wrap:anywhere;min-width:0}
.lead{grid-column:1/-1;margin:8px 0 0;max-width:76ch;color:var(--text-muted)}
.segmented{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--segment-track)}
.segment{height:32px;padding:0 14px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);font-size:14px;white-space:nowrap;cursor:pointer;transition:background var(--t-fast),color var(--t-fast)}
.segment:hover{background:var(--btn-bg-hover);color:var(--text-primary)}
.segment[aria-pressed="true"]{background:var(--bg-panel);color:var(--accent);font-weight:600;box-shadow:var(--shadow-1)}
.stats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat{display:inline-flex;align-items:baseline;gap:6px;min-height:44px;padding:6px 16px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-panel);color:var(--text-secondary);font-size:15px;white-space:nowrap;cursor:pointer;transition:border-color var(--t-fast),background var(--t-fast)}
.stat strong{color:var(--text-primary);font-size:20px;font-variant-numeric:tabular-nums}
.stat[data-filter="changed"] strong{color:var(--info)}
.stat[data-filter="review"] strong{color:var(--amber)}
.stat:hover{border-color:var(--border-strong)}
.stat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint)}
.legend{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:14px 0 0;color:var(--text-muted);font-size:14px}

/* 差异标记 */
del{color:var(--del-text);background:var(--del-bg);text-decoration:line-through;text-decoration-thickness:2px;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
ins{color:var(--ins-text);background:var(--ins-bg);text-decoration:none;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.legend del,.legend ins{padding:0 6px}

/* 面板：译文核对 / 连续文稿 */
.panel{margin-top:24px;padding:20px 24px;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-panel);box-shadow:var(--shadow-1)}
.panel-title{margin:0;font-size:17px;font-weight:600}
.hint{margin:8px 0 0;color:var(--text-muted)}
.edit-buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
#edit-status{margin-top:12px;color:var(--text-secondary);white-space:pre-wrap}
.btn{height:40px;padding:0 18px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--btn-bg);color:var(--btn-text);font-size:15px;cursor:pointer;transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast)}
.btn:hover:not(:disabled){background:var(--btn-bg-hover);border-color:var(--border-strong);color:var(--text-primary)}
.btn.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-text);font-weight:600}
.btn.primary:hover:not(:disabled){border-color:var(--accent-hover);background:var(--accent-hover);color:var(--accent-text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
details.panel{padding:0}
details.panel>summary{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:16px 24px;font-weight:600;cursor:pointer;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{content:"";flex:none;width:8px;height:8px;margin:0 2px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);transform:rotate(-45deg);transition:transform var(--t-fast)}
details.panel[open]>summary::before{transform:rotate(45deg)}
.summary-note{color:var(--text-muted);font-size:14px;font-weight:400}
.reading{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 32px;padding:18px 24px 24px;border-top:1px solid var(--border-subtle)}
.reading .text{font-size:17px}

/* 工具栏：吸顶，滚动长列表时筛选与搜索始终可用 */
.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:28px 0 16px;padding:12px 0;background:var(--bg-base);border-bottom:1px solid var(--border-subtle)}
.toolbar label{color:var(--text-muted);font-size:15px}
select,input[type=search]{height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-input);color:var(--text-primary);font-size:16px;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
select{padding-right:8px;cursor:pointer}
input[type=search]{flex:1;min-width:200px}
input[type=search]::placeholder{color:var(--text-faint)}
select:focus,input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus-ring)}
.visible-count{margin-left:auto;color:var(--text-muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* 逐条对比卡片 */
#rows{display:grid;gap:14px}
.row{padding:16px 24px 22px;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-panel);box-shadow:var(--shadow-1);transition:border-color var(--t-fast)}
.row.is-review{border-color:var(--amber-line)}
.row.edited{border-color:var(--accent)}
.row-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:14px}
.row-id{color:var(--text-muted);font-family:var(--font-mono);font-size:14px}
.row-time{color:var(--text-secondary);font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;padding:1px 10px;border-radius:999px;background:var(--bg-raised);color:var(--text-secondary);font-size:14px;font-weight:600;line-height:1.7}
.badge[data-tone="red"]{background:var(--red-soft);color:var(--del-text)}
.badge[data-tone="amber"]{background:var(--amber-soft);color:var(--amber)}
.badge[data-tone="info"]{background:var(--info-soft);color:var(--info)}
.badge.edited-tag{background:var(--accent-tint);color:var(--accent)}
.diff{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:0 12px;align-items:start}
.side{min-width:0}
.side-label{margin:0 0 4px;color:var(--text-muted);font-size:14px;font-weight:600}
.diff-arrow{align-self:start;margin-top:32px;color:var(--text-faint);font-size:18px;line-height:1;text-align:center}
.text{font-size:18px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.removed{color:var(--text-faint)}
textarea{display:block;width:100%;min-height:96px;margin-top:2px;padding:10px 12px;resize:vertical;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-input);color:var(--text-primary);font-size:18px;line-height:1.7;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus-ring)}
textarea[aria-invalid="true"]{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.reason{margin-top:16px;padding:10px 14px;border-radius:var(--radius-md);background:var(--bg-raised);color:var(--text-primary);white-space:pre-wrap;overflow-wrap:anywhere}
.reason.is-review{background:var(--amber-soft)}
.empty{padding:40px 24px;border:1px dashed var(--border);border-radius:var(--radius-lg);color:var(--text-muted);text-align:center}

@media (max-width:720px){
 .page{padding:24px 16px 56px}
 .page-head{grid-template-columns:minmax(0,1fr)}
 .theme-switch{justify-self:start}
 h1{font-size:26px}
 .reading{grid-template-columns:minmax(0,1fr);padding:16px}
 details.panel>summary{padding:14px 16px}
 .panel{padding:16px}
 .row{padding:14px 16px 18px}
 .diff{grid-template-columns:minmax(0,1fr);gap:0}
 .diff-arrow{margin:6px 0;text-align:left;transform:rotate(90deg);width:18px}
 .text,textarea{font-size:17px}
 .visible-count{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
 .toolbar,.theme-switch,.edit-buttons{display:none}
 .stat{cursor:default}
 .row,.panel{break-inside:avoid}
}
</style></head><body>
<div class="page">
<header class="page-head">
 <div><p class="eyebrow">MAW · AI 处理前后对比</p><h1 id="page-title">AI 处理前后对比</h1></div>
 <div class="theme-switch segmented" role="group" aria-label="外观主题"><button type="button" class="segment" data-theme-choice="light">浅色</button><button type="button" class="segment" data-theme-choice="dark">深色</button><button type="button" class="segment" data-theme-choice="system" title="跟随系统">自动</button></div>
 <p id="lead" class="lead">划删为已生效的删除，绿底为新增或改写后的文字；待核查内容仍保留。此页是生成时的结果快照，工程后续修改不会同步到此页。</p>
 <div id="summary" class="stats" role="group" aria-label="统计与快速筛选"></div>
 <p id="legend" class="legend" aria-label="图例"><span>图例</span><del>删除</del><ins>新增</ins></p>
</header>
<section id="edit-actions" class="panel" hidden><h2 class="panel-title">译文核对</h2><p class="hint">只修改译文，时间和其他轨道保持快照内容。修改保存在当前页面；下载「核对后 MOSP」可在 MAWE 继续编辑。此页不会回写磁盘工程。</p><div class="edit-buttons"><button id="download-project" class="btn primary" type="button" disabled>下载核对后 MOSP</button><button id="reset-translations" class="btn" type="button">恢复全部原译文</button></div><div id="edit-status" role="status" aria-live="polite"></div></section>
<details class="panel"><summary>连续文稿 · 通读检查<span class="summary-note">按时间顺序连成全文</span></summary><div class="reading"><section><h3 id="before-label" class="side-label">处理前</h3><div id="before" class="text"></div></section><section><h3 id="after-label" class="side-label">处理后</h3><div id="after" class="text"></div></section></div></details>
<div class="toolbar"><label for="filter">显示</label><select id="filter"><option value="all">全部</option><option value="changed">有修改</option><option value="review">待核查</option></select><input id="search" type="search" placeholder="搜索原文、结果或原因" aria-label="搜索"><span id="visible-count" class="visible-count" aria-live="polite"></span></div>
<main id="rows"></main><p id="empty" class="empty" hidden>没有符合条件的记录。</p>
</div>
<script id="comparison-data" type="application/json">{{DATA}}</script>
<script>{{REVIEW_SCRIPT}}</script>
<script>
const data=JSON.parse(document.getElementById('comparison-data').textContent);
const byId=id=>document.getElementById(id);

const THEME_KEY='maw.ai-comparison.theme';
const themeMedia=typeof window.matchMedia==='function'?window.matchMedia('(prefers-color-scheme: dark)'):null;
let themePref=(()=>{try{const value=localStorage.getItem(THEME_KEY);return ['light','dark','system'].includes(value)?value:'system';}catch{return 'system';}})();
function applyTheme(){
 const dark=themePref==='dark'||(themePref==='system'&&Boolean(themeMedia?.matches));
 if(dark)delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme='light';
 for(const button of document.querySelectorAll('[data-theme-choice]'))button.setAttribute('aria-pressed',String(button.dataset.themeChoice===themePref));
}
for(const button of document.querySelectorAll('[data-theme-choice]'))button.addEventListener('click',()=>{themePref=button.dataset.themeChoice;try{localStorage.setItem(THEME_KEY,themePref);}catch{}applyTheme();});
themeMedia?.addEventListener?.('change',()=>{if(themePref==='system')applyTheme();});
// 打印默认不带背景色，暗色文字在白纸上不可读：打印期间临时切到亮色。
window.addEventListener('beforeprint',()=>{document.documentElement.dataset.theme='light';});
window.addEventListener('afterprint',applyTheme);
applyTheme();

const operations={ai_cleanup:'口播整理','ai-cleanup':'口播整理',proofread:'校对文本',resegment:'重新断句',custom:'自定义处理'};
const languages={en:'英文',zh:'中文'},markers={bilingual:'双语合一',combined:'整合',backfill:'回填'};
function operationLabel(operation){
 const match=/^translate[-_]([a-z]+)(?:[-_](bilingual|combined|backfill))?$/.exec(operation||'');
 if(match)return `翻译成${languages[match[1]]||match[1]}${match[2]?` · ${markers[match[2]]}`:''}`;
 return operations[operation]||operation||'AI 处理';
}
const isTranslation=Boolean(data.translationReview)||/^translate[-_]/.test(data.operation||'');
// 重新断句会把相邻字幕并入同一条结果，逐字标「新增」会误导，只保留删除标记。
const markInserted=!isTranslation&&!/resegment/.test(data.operation||'');
const title=operationLabel(data.operation);
byId('page-title').textContent=title;document.title=`${title} · AI 处理前后对比`;
const snapshotNote='此页是生成时的结果快照，工程后续修改不会同步到此页。';
if(isTranslation){
 byId('lead').textContent=`左侧为原文，右侧为译文。${snapshotNote}`;
 byId('legend').hidden=true;byId('before-label').textContent='原文';byId('after-label').textContent='译文';
}else if(!markInserted){
 byId('lead').textContent=`划删为已生效的删除；待核查内容仍保留。${snapshotNote}`;
 byId('legend').querySelector('ins').hidden=true;
}

const filterStats=[['all','条原始字幕',data.rows.length],['changed','条有修改',data.rows.filter(r=>r.before!==r.after).length],['review','条待核查',data.rows.filter(r=>r.review).length]];
for(const [filter,label,count] of filterStats){
 if(filter==='changed'&&isTranslation)continue;
 const button=document.createElement('button');button.type='button';button.className='stat';button.dataset.filter=filter;
 const strong=document.createElement('strong');strong.textContent=String(count);button.append(strong,label);
 button.addEventListener('click',()=>{byId('filter').value=filter;render();});
 byId('summary').append(button);
}
byId('before').textContent=data.before;
byId('after').textContent=data.after;
const labels={discard:'整段删除',edit:'局部删除',review:'待核查',keep:'保留',changed:'已修改'};
const tones={discard:'red',edit:'red',review:'amber',changed:'info'};
let packet=null,entries=new Map(),edits=new Map();
function rowAfter(row){return entries.has(row.id)?(edits.get(row.id)??entries.get(row.id).translation):row.after;}
function editList(){return [...edits].map(([id,text])=>({id,text}));}
function clock(ms){
 const total=Math.max(0,Math.round(Number(ms)/10)),pad=value=>String(value).padStart(2,'0');
 const hours=Math.floor(total/360000),minutes=Math.floor(total/6000)%60,seconds=Math.floor(total/100)%60;
 return `${hours?`${hours}:${pad(minutes)}`:minutes}:${pad(seconds)}.${pad(total%100)}`;
}
// 处理后一侧标出新增文字（与处理前的最长公共子序列之外的字符）；过长时不标注。
function insertedParts(before,after){
 const a=Array.from(before),b=Array.from(after),n=a.length,m=b.length,width=m+1;
 if(!n||!m||n*m>400000)return [{text:after,inserted:false}];
 const table=new Uint16Array((n+1)*width);
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)table[i*width+j]=a[i]===b[j]?table[(i+1)*width+j+1]+1:Math.max(table[(i+1)*width+j],table[i*width+j+1]);
 const parts=[],push=(text,inserted)=>{const last=parts[parts.length-1];if(last&&last.inserted===inserted)last.text+=text;else parts.push({text,inserted});};
 let i=0,j=0;
 while(j<m){
  if(i<n&&a[i]===b[j]){push(b[j],false);i++;j++;}
  else if(i<n&&table[(i+1)*width+j]>=table[i*width+j+1])i++;
  else{push(b[j],b[j]!=='\n');j++;}
 }
 return parts;
}
function appendParts(container,parts,tag,flag){for(const part of parts){const span=document.createElement(part[flag]?tag:'span');span.textContent=part.text;container.append(span);}}
function updateDraft(){
 const changed=[...edits].filter(([id,text])=>text!==entries.get(id).translation);
 const problems=changed.filter(([,text])=>!text.trim()||text.length>20000||/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/.test(text)).map(([id])=>`${id}：译文为空、超长或含无效字符`);
 byId('edit-status').textContent=`手动修改 ${changed.length} 条${problems.length?'；请修正后导出：\n'+problems.join('\n'):'；可下载核对后的工程。'}`;
 byId('download-project').disabled=!packet||problems.length>0;
 byId('after').textContent=data.rows.map(rowAfter).join('\n');
}
function render(){
 const filter=byId('filter').value,query=byId('search').value.toLowerCase();
 for(const button of byId('summary').children)button.setAttribute('aria-pressed',String(button.dataset.filter===filter));
 const visible=data.rows.filter(r=>(filter!=='changed'||r.before!==rowAfter(r))&&(filter!=='review'||r.review)&&`${r.before}\n${rowAfter(r)}\n${r.reason}\n${(r.notes||[]).join('\n')}`.toLowerCase().includes(query));
 byId('rows').replaceChildren();byId('empty').hidden=visible.length>0;
 byId('visible-count').textContent=`显示 ${visible.length} / ${data.rows.length} 条`;
 for(const row of visible){
  const card=document.createElement('article');card.className='row';card.classList.toggle('is-review',Boolean(row.review));
  const head=document.createElement('header');head.className='row-head';
  const id=document.createElement('span');id.className='row-id';id.textContent=row.id;
  const time=document.createElement('span');time.className='row-time';time.textContent=`${clock(row.start)} – ${clock(row.end)}`;
  const badge=document.createElement('span');badge.className='badge';
  if(isTranslation&&row.decision==='changed')badge.textContent='已翻译';
  else{badge.textContent=labels[row.decision]||labels.keep;if(tones[row.decision])badge.dataset.tone=tones[row.decision];}
  const editedTag=document.createElement('span');editedTag.className='badge edited-tag';editedTag.textContent='已手动修改';editedTag.hidden=true;
  head.append(id,time,badge,editedTag);card.append(head);
  const cols=document.createElement('div');cols.className='diff';
  const before=document.createElement('section'),after=document.createElement('section');before.className='side';after.className='side';
  const left=document.createElement('h3');left.className='side-label';left.textContent=isTranslation?'原文':'处理前';before.append(left);
  const right=document.createElement('h3');right.className='side-label';right.textContent=isTranslation?'译文':'处理后';after.append(right);
  const annotated=document.createElement('div');annotated.className='text';
  const plainSource=packet||(isTranslation&&rowAfter(row));
  appendParts(annotated,plainSource?[{text:entries.get(row.id)?.source??row.before}]:row.parts,'del','deleted');before.append(annotated);
  const arrow=document.createElement('div');arrow.className='diff-arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent='→';
  const entry=entries.get(row.id);
  const markEdited=value=>{const edited=value!==entry.translation;card.classList.toggle('edited',edited);editedTag.hidden=!edited;};
  if(entry?.editable){
   const input=document.createElement('textarea');input.value=rowAfter(row);input.setAttribute('aria-label',`译文 ${row.id}`);input.dataset.cueId=row.id;
   input.addEventListener('input',()=>{edits.set(row.id,input.value);input.setAttribute('aria-invalid',String(!input.value.trim()||input.value.length>20000));markEdited(input.value);updateDraft();});
   markEdited(input.value);after.append(input);
  }else{
   const cleaned=document.createElement('div');cleaned.className='text';const text=rowAfter(row);
   if(!text){cleaned.textContent='（整段删除）';cleaned.classList.add('removed');}
   else appendParts(cleaned,markInserted&&text!==row.before?insertedParts(row.before,text):[{text,inserted:false}],'ins','inserted');
   after.append(cleaned);
  }
  cols.append(before,arrow,after);card.append(cols);
  if(row.reason&&!(row.notes||[]).length){const reason=document.createElement('div');reason.className='reason';reason.classList.toggle('is-review',Boolean(row.review));reason.textContent=(row.review?'待核查：':'处理原因：')+row.reason;card.append(reason);}
  for(const note of row.notes||[]){const element=document.createElement('div');element.className='reason';element.classList.toggle('is-review',/待核查|待确认/.test(note));element.textContent=note;card.append(element);}
  byId('rows').append(card);
 }
}
byId('filter').addEventListener('change',render);byId('search').addEventListener('input',render);render();
byId('reset-translations').addEventListener('click',()=>{edits.clear();updateDraft();render();});
byId('download-project').addEventListener('click',async()=>{
 byId('download-project').disabled=true;
 try{
  const {project,changed}=await MAWTranslationReview.applyEdits(data.translationReview,editList());
  const blob=new Blob([JSON.stringify(project,null,2)+'\n'],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=data.translationReview.filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  byId('edit-status').textContent=`已下载核对后 MOSP，手动修改 ${changed} 条。`;
 }catch(error){byId('edit-status').textContent=error.message;}
 finally{byId('download-project').disabled=false;}
});
if(data.translationReview){
 byId('edit-actions').hidden=false;
 MAWTranslationReview.readPacket(data.translationReview).then(value=>{
  packet=value;entries=new Map(packet.entries.map(entry=>[entry.id,entry]));updateDraft();render();
 }).catch(error=>{byId('edit-status').textContent=error.message;byId('download-project').disabled=true;});
}
</script></body></html>
