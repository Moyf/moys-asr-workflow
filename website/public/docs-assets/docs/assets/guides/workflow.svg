<svg xmlns="http://www.w3.org/2000/svg" width="540" height="610" viewBox="0 0 540 610" role="img" aria-labelledby="title desc">
  <title id="title">MAW 从本地媒体到字幕交付的五步流程</title>
  <desc id="desc">选择媒体，使用云端或实验性本地 ASR 转写，得到 SRT 和 MOSP 工程，在 MAWE 校对并保存工程，最后导出交付字幕。保留原始媒体和工程，波形可以重建。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7fd6b2"/></marker>
  </defs>
  <rect width="540" height="610" rx="16" fill="#151d23"/>
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif">
    <text x="30" y="40" fill="#edf6f1" font-size="24" font-weight="700">一次字幕工程的完整路径</text>
    <g fill="#202e36" stroke="#42575f">
      <rect x="30" y="62" width="480" height="78" rx="10"/>
      <rect x="30" y="164" width="480" height="78" rx="10"/>
      <rect x="30" y="266" width="480" height="78" rx="10" stroke="#7fd6b2"/>
      <rect x="30" y="368" width="480" height="78" rx="10"/>
      <rect x="30" y="470" width="480" height="78" rx="10"/>
    </g>
    <g fill="#7fd6b2" font-size="24" font-weight="700" text-anchor="middle">
      <text x="60" y="110">1</text><text x="60" y="212">2</text><text x="60" y="314">3</text><text x="60" y="416">4</text><text x="60" y="518">5</text>
    </g>
    <g fill="#edf6f1" font-size="22" font-weight="600">
      <text x="94" y="95">选择本地音频 / 视频</text>
      <text x="94" y="197">ASR 转写</text>
      <text x="94" y="299">得到 SRT + .mosp 工程</text>
      <text x="94" y="401">在 MAWE 校对并保存工程</text>
      <text x="94" y="503">导出交付文件</text>
    </g>
    <g fill="#b7cbd2" font-size="17">
      <text x="94" y="122">多音轨视频先确认声音轨道</text>
      <text x="94" y="224">云端 API，或实验性本地模型</text>
      <text x="94" y="326">工程用于继续编辑；SRT 用于通用交付</text>
      <text x="94" y="428">检查文字、起止时间与波形</text>
      <text x="94" y="530">通用字幕用 SRT，需要样式用 ASS</text>
    </g>
    <text x="270" y="581" text-anchor="middle" fill="#7fd6b2" font-size="17">保留原始媒体和工程 · 波形缓存可以重建</text>
  </g>
  <g fill="none" stroke="#7fd6b2" stroke-width="2" marker-end="url(#arrow)">
    <path d="M270 144V159"/><path d="M270 246V261"/><path d="M270 348V363"/><path d="M270 450V465"/>
  </g>
</svg>
