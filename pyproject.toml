[project]
name = "moys-asr-workflow"
version = "1.0.1"
description = "A small Qwen ASR API to local subtitle-editor workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "jieba>=0.42",
    "requests>=2.28",
]

[project.optional-dependencies]
# CPU 版（默认）：torch 从 PyPI 安装，无 CUDA 加速
local = [
    "qwen-asr",
    "modelscope",
    "faster-whisper",
    "torch>=2.0",
]
# CUDA 版：torch 从 PyTorch CUDA 索引安装
# 安装方式：
#   uv sync --extra local-cuda
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu124
local-cuda = [
    "qwen-asr",
    "modelscope",
    "faster-whisper",
    "torch>=2.0",
]

# PyTorch CUDA 索引注册（供参考，默认不激活）
# [[tool.uv.index]]
# name = "pytorch-cu124"
# url = "https://download.pytorch.org/whl/cu124"

[tool.commitizen]
name = "cz_conventional_contributors"
