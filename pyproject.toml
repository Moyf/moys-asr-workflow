[project]
name = "moys-asr-workflow"
version = "1.0.1"
description = "A small Qwen ASR API to local subtitle-editor workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "jieba>=0.42",
    "requests>=2.28",
]

[project.optional-dependencies]
local = [
    "qwen-asr",
    "modelscope",
    "faster-whisper",
    "torch>=2.0",
]
local-cuda = [
    "qwen-asr",
    "modelscope",
    "faster-whisper",
    "torch>=2.0",
]

# 默认使用 PyTorch CUDA 索引（CUDA 版 torch 兼容 CPU）
# 无 NVIDIA GPU 时 torch 自动回退 CPU，无需额外配置
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[tool.commitizen]
name = "cz_conventional_contributors"
