[project]
name = "moys-asr-workflow"
version = "1.4.0"
description = "A small cloud ASR API to local subtitle-editor workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "jieba>=0.42",
    "opencc-python-reimplemented>=0.1.7",
    "pywebview>=6.2.1; sys_platform != 'linux'",
    "pywebview[qt]>=6.2.1; sys_platform == 'linux'",
    "requests>=2.28",
    # numpy 由 OCR 路径使用（maw/postprocess_ocr 内 lazy import）；.ReaPeaks
    # 生成已改由 Rust 内核承担，不再依赖 numpy。
    "numpy>=2.2,<2.5",
    # Rust .ReaPeaks 生成内核（MIT/Apache-2.0，独立仓库）；唯一生成路径，
    # 无 Python 参考实现回退，缺失或版本不符时直接暴露 ImportError。
    "reapeaks>=0.3"
]

[project.optional-dependencies]
local = [
    "accelerate>=1.12",
    "funasr>=1.2.6",
    "hf-xet>=1.5",
    "qwen-asr>=0.0.6",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]
ocr = [
    "onnxruntime>=1.18",
    "pillow>=10.0.0",
    "rapidocr>=3.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[dependency-groups]
build = [
    "pyinstaller==6.16.0",
]
