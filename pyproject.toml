[project]
name = "moys-asr-workflow"
version = "1.5.0-beta.8"
description = "A small cloud ASR API to local subtitle-editor workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fonttools>=4.55",
    "jieba>=0.42",
    "opencc-python-reimplemented>=0.1.7",
    "pywebview>=6.2.1; sys_platform != 'linux'",
    "pywebview[qt]>=6.2.1; sys_platform == 'linux'",
    "requests>=2.28",
    # Rust .ReaPeaks 生成内核（MIT/Apache-2.0，独立仓库）；唯一生成路径，
    # 无 Python 参考实现回退，缺失或版本不符时直接暴露 ImportError。
    "reapeaks>=0.3.1"
]

[project.optional-dependencies]
local = [
    "accelerate>=1.12",
    # faster-whisper（CTranslate2 后端）不依赖 transformers，不会与
    # qwen-asr 锁定的 Transformers 4.x 冲突；onnxruntime 是其硬依赖
    # （Silero VAD），与 ocr extra 的 onnxruntime>=1.18 范围兼容。
    "faster-whisper>=1.2,<2",
    "funasr>=1.3.29",
    "hf-xet>=1.5",
    "qwen-asr>=0.0.6",
    "torch==2.13.0+cu130; sys_platform != 'darwin'",
    "torch>=2.13.0; sys_platform == 'darwin'",
    "torchaudio==2.11.0+cu130; sys_platform != 'darwin'",
    "torchaudio>=2.11.0; sys_platform == 'darwin'",
]
ocr = [
    # numpy 由 OCR 路径使用（maw/postprocess_ocr 内 lazy import）；.ReaPeaks
    # 生成已改由 Rust 内核承担，不再依赖 numpy。
    "numpy>=2.2,<2.5",
    "onnxruntime>=1.18",
    "pillow>=10.0.0",
    "rapidocr>=3.9.0",
]
# maw：MOSS runtime 依赖（Transformers 5.x）与 local extra 的 qwen-asr
# （Transformers==4.57.6）互斥，无法承载于同一个 uv.lock（uv lock 解析
# 全部 extras 组合），故独立声明在 moss-requirements.in 并由
# `uv pip compile` 冻结（与 local/ocr 的 uv export 管线并行）。

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[tool.ruff]
target-version = "py311"
include = [
    "*.py",
    "maw/**/*.py",
    "scripts/**/*.py",
    "server-editor/**/*.py",
]
extend-exclude = ["tests/**", "website/**", "desktop/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Soniox keeps these names as compatibility exports for existing callers.
"maw/soniox.py" = ["F401"]

[dependency-groups]
build = [
    "pyinstaller==6.16.0",
]
dev = [
    "ruff>=0.16.3",
]
