[project]
name = "moys-asr-workflow"
version = "1.0.1"
description = "A small Qwen ASR API to local subtitle-editor workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "jieba>=0.42",
    "requests>=2.28",
]

[project.optional-dependencies]
# CPU 版（默认）：torch 从 PyPI 安装（约 800MB），无 GPU 也能跑
local = [
    "qwen-asr",
    "modelscope",
    "faster-whisper",
    "torch>=2.0",
]
# CUDA 版：安装后需额外替换 torch 为 CUDA 版（约 3-4GB）
#   uv sync --extra local-cuda
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu124
local-cuda = [
    "qwen-asr",
    "modelscope",
    "faster-whisper",
    "torch>=2.0",
]

[tool.commitizen]
name = "cz_conventional_contributors"
