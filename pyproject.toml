[project]
name = "moys-asr-workflow"
version = "1.4.0"
description = "A small cloud ASR API to local subtitle-editor workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "jieba>=0.42",
    "opencc-python-reimplemented>=0.1.7",
    "pywebview>=6.2.1; sys_platform != 'linux'",
    "pywebview[qt]>=6.2.1; sys_platform == 'linux'",
    "requests>=2.28",
    "numpy>=2.2,<2.5",
]

[project.optional-dependencies]
local = [
    "accelerate>=1.12",
    "funasr>=1.2.6",
    "hf-xet>=1.5",
    "qwen-asr>=0.0.6",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]
ocr = [
    "onnxruntime>=1.18",
    "pillow>=10.0.0",
    "rapidocr>=3.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[tool.ruff]
target-version = "py311"
include = [
    "*.py",
    "maw/**/*.py",
    "scripts/**/*.py",
    "server-editor/**/*.py",
]
extend-exclude = ["tests/**", "website/**", "desktop/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Soniox keeps these names as compatibility exports for existing callers.
"maw/soniox.py" = ["F401"]

[dependency-groups]
build = [
    "pyinstaller==6.16.0",
]
dev = [
    "ruff>=0.16.3",
]
