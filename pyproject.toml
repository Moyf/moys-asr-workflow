[project]
name = "moys-asr-workflow"
version = "1.3.2"
description = "A small cloud ASR API to local subtitle-editor workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "jieba>=0.42",
    "pywebview>=6.2.1",
    "requests>=2.28",
]

[project.optional-dependencies]
local = [
    "accelerate>=1.12",
    "funasr>=1.2.6",
    "hf-xet>=1.5",
    "qwen-asr>=0.0.6",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[dependency-groups]
build = [
    "pyinstaller==6.16.0",
]
