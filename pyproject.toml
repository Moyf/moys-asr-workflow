[project]
name = "moys-asr-workflow"
version = "1.3.1"
description = "A small cloud ASR API to local subtitle-editor workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "jieba>=0.42",
    "pywebview>=6.2.1",
    "requests>=2.28",
]

[project.optional-dependencies]
local = [
    "funasr>=1.2.6",
    "qwen-asr>=0.0.6",
]

[dependency-groups]
build = [
    "pyinstaller==6.16.0",
]
